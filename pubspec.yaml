name: wordpress_jwt_auth
description: Dart client for the JWT Authentication for WP REST API WordPress plugin. Login, token validation, typed errors and pluggable token storage.
version: 1.0.0
repository: https://github.com/nurullahturkoglu/flutter-jwt-auth-for-wordpress
issue_tracker: https://github.com/nurullahturkoglu/flutter-jwt-auth-for-wordpress/issues
topics:
  - wordpress
  - jwt
  - authentication
  - dio

environment:
  sdk: ^3.8.0

dependencies:
  dio: ^5.11.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0
